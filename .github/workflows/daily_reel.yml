name: Daily Reel Post

on:
  schedule:
    # Cible : 17h19 UTC = 19h19 Paris (été/CEST ; 18h19 en hiver/CET), décalé
    # hors pile-heure. Les crons GitHub subissent des retards de charge parfois
    # énormes (~6h observés les 5-7 juillet 2026) : les entrées suivantes sont
    # des RATTRAPAGES toutes les 30 min jusqu'à 21h49 UTC (23h49 Paris été) —
    # le garde-fou anti-doublon ci-dessous fait que seul le premier run du
    # jour publie, les suivants s'arrêtent en ~15s.
    - cron: "19 17 * * *"
    - cron: "49 17 * * *"
    - cron: "19 18 * * *"
    - cron: "49 18 * * *"
    - cron: "19 19 * * *"
    - cron: "49 19 * * *"
    - cron: "19 20 * * *"
    - cron: "49 20 * * *"
    - cron: "19 21 * * *"
    - cron: "49 21 * * *"
  workflow_dispatch:         # déclenchement manuel depuis GitHub

permissions:
  contents: write

# Groupe partagé avec daily_post.yml : jamais deux publications en même temps
# (évite les courses sur le push du tracker et les doublons Instagram).
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reels

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet requis : un clone shallow fait croire à git que le commit du jour a "ajouté" tous les fichiers, faussant le garde-fou anti-doublon ci-dessous

      - name: Vérifier qu'aucun reel n'a déjà été publié aujourd'hui
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 1) Créneau horaire (runs planifiés seulement). Les crons de rattrapage
          #    subissent parfois 2-3h de retard et franchissent minuit UTC : le
          #    run voyait alors un « nouveau jour », publiait vers 01h30 Paris,
          #    et la publication de 19h19 du même jour était ensuite ignorée
          #    (observé du 10 au 14/11/2026). Un run planifié qui démarre avant
          #    17h UTC est donc un retardataire de la veille : on l'ignore.
          #    Les déclenchements manuels/externes (workflow_dispatch) ne sont
          #    pas concernés.
          HOUR=$((10#$(date -u +%H)))
          if [ "$EVENT_NAME" = "schedule" ] && [ "$HOUR" -lt 17 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  Run planifié arrivé hors créneau (${HOUR}h UTC < 17h) — retardataire de la veille, ignoré."
            exit 0
          fi
          # 2) Anti-doublon : un commit du jour (UTC) sur le tracker = déjà publié.
          LAST_DATE=$(git log -1 --format=%cd --date=format:%Y-%m-%d -- posted_reels.json)
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$LAST_DATE" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  Un reel a déjà été publié aujourd'hui ($LAST_DATE) — run ignoré pour éviter un doublon."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reels/package-lock.json

      - name: Install Node dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Install Remotion system libraries (Chrome headless)
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests pynacl

      - name: Pick today's verse
        if: steps.guard.outputs.skip != 'true'
        run: python pick_verse.py

      - name: Render reel (Remotion)
        if: steps.guard.outputs.skip != 'true'
        run: npx remotion render Verse out/daily_reel.mp4 --props=render_props.json

      - name: Post reel to Instagram
        if: steps.guard.outputs.skip != 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}   # optionnel : PAT pour persister le token Instagram renouvelé
        run: python post_reel.py

      - name: Commit tracker update
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add posted_reels.json
          git diff --staged --quiet || git commit -m "Update reels tracker"
          git pull --rebase origin main   # un autre workflow a pu pousser entre-temps
          git push
