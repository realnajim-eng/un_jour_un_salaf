name: Daily Salaf Post

on:
  schedule:
    # Cible : 15h17 UTC = 17h17 Paris (été/CEST ; 16h17 en hiver/CET), décalé
    # hors pile-heure. Les crons GitHub subissent des retards de charge parfois
    # énormes (~6h observés les 5-7 juillet 2026) : les entrées suivantes sont
    # des RATTRAPAGES toutes les 30 min jusqu'à 20h47 UTC (22h47 Paris été) —
    # le garde-fou anti-doublon ci-dessous fait que seul le premier run du
    # jour publie, les suivants s'arrêtent en ~15s.
    - cron: "17 15 * * *"
    - cron: "47 15 * * *"
    - cron: "17 16 * * *"
    - cron: "47 16 * * *"
    - cron: "17 17 * * *"
    - cron: "47 17 * * *"
    - cron: "17 18 * * *"
    - cron: "47 18 * * *"
    - cron: "17 19 * * *"
    - cron: "47 19 * * *"
    - cron: "17 20 * * *"
    - cron: "47 20 * * *"
  workflow_dispatch:        # déclenchement manuel depuis GitHub

permissions:
  contents: write

# Groupe partagé avec daily_reel.yml : jamais deux publications en même temps
# (évite les courses sur le push du tracker et les doublons Instagram).
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet requis : un clone shallow fait croire à git que le commit du jour a "ajouté" tous les fichiers, faussant le garde-fou anti-doublon ci-dessous

      - name: Vérifier qu'aucun post n'a déjà été publié aujourd'hui
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 1) Créneau horaire (runs planifiés seulement). Les crons de rattrapage
          #    subissent parfois 2-3h de retard et franchissent minuit UTC : le
          #    run voyait alors un « nouveau jour », publiait vers 01h30 Paris,
          #    et la publication de 17h17 du même jour était ensuite ignorée
          #    (observé du 10 au 14/11/2026). Un run planifié qui démarre avant
          #    15h UTC est donc un retardataire de la veille : on l'ignore.
          #    Les déclenchements manuels/externes (workflow_dispatch) ne sont
          #    pas concernés.
          HOUR=$((10#$(date -u +%H)))
          if [ "$EVENT_NAME" = "schedule" ] && [ "$HOUR" -lt 15 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  Run planifié arrivé hors créneau (${HOUR}h UTC < 15h) — retardataire de la veille, ignoré."
            exit 0
          fi
          # 2) Anti-doublon : un commit du jour (UTC) sur le tracker = déjà publié.
          LAST_DATE=$(git log -1 --format=%cd --date=format:%Y-%m-%d -- tracker.json)
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$LAST_DATE" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  Un post a déjà été publié aujourd'hui ($LAST_DATE) — run ignoré pour éviter un doublon."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Generate caption (Claude API)
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_caption.py

      - name: Generate image & post to Instagram
        if: steps.guard.outputs.skip != 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}   # optionnel : PAT pour persister le token Instagram renouvelé
        run: python post_salaf.py

      - name: Commit tracker update
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add tracker.json
          git diff --staged --quiet || git commit -m "Update tracker"
          git pull --rebase origin main   # un autre workflow a pu pousser entre-temps
          git push
